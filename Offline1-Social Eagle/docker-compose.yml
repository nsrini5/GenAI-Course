name: social-eagle-rag

services:
  rag:
    build: .
    image: social-eagle-rag:latest
    container_name: social-eagle-rag
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - rag-data:/data
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # Stage 4 – vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"        # dashboard: http://localhost:6333/dashboard (localhost only)
    restart: unless-stopped

  # Stage 6 – graph database
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"        # Neo4j Browser (localhost only – use an SSH tunnel on the VPS)
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Optional local LLM:  docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  rag-data:
  qdrant-data:
  neo4j-data:
  ollama-data:

# Optional reverse proxy so the app is served on port 80/443 instead of 8000.
# sudo cp deploy/nginx-hybrid-rag.conf /etc/nginx/sites-available/hybrid-rag
# sudo ln -s /etc/nginx/sites-available/hybrid-rag /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d rag.yourdomain.com
server {
    listen 80;
    server_name rag.yourdomain.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

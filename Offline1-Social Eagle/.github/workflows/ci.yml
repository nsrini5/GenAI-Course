name: Offline1-Social Eagle CI
# Place this file at  GenAI Course/.github/workflows/  (repo root) for GitHub to run it.

on:
  push:
    branches: [main]
    paths: ["Offline1-Social Eagle/**"]
  pull_request:
    paths: ["Offline1-Social Eagle/**"]

defaults:
  run:
    working-directory: "Offline1-Social Eagle"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          EMBED_BACKEND: lsa
          LLM_PROVIDER: none
          QDRANT_URL: ""
          NEO4J_URI: ""

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t social-eagle-rag:ci .

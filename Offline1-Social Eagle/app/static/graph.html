<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Knowledge Graph – Spotify Architecture</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  body { margin:0; font:14px system-ui,-apple-system,sans-serif; background:#0f1115; color:#e8e8ea; }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #2a2f3a; }
  a { color:#1db954; } #stats { color:#9aa0aa; } #net { height:calc(100vh - 60px); }
  input { padding:6px 10px; border-radius:6px; border:1px solid #2a2f3a; background:#181b22; color:#e8e8ea; }
  #info { position:fixed; right:12px; bottom:12px; max-width:340px; max-height:45vh; overflow:auto; background:#181b22;
          border-radius:8px; padding:12px; font-size:13px; display:none; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <strong>Knowledge Graph</strong><span id="stats"></span>
  <input id="filter" placeholder="Filter type, e.g. Service" />
  <a href="/">← Ask questions</a>
</header>
<div id="net"></div>
<div id="info"></div>
<script>
const key = (() => { try { return localStorage.getItem('apiKey') || ''; } catch(_) { return ''; } })();
const H = key ? { 'X-API-Key': key } : {};
let all;
async function load() {
  const r = await fetch('/graph', { headers: H });
  if (r.status === 401) { const k = prompt('API key'); if (k) { try { localStorage.setItem('apiKey', k); } catch(_){} location.reload(); } return; }
  all = await r.json();
  document.getElementById('stats').textContent = `${all.nodes.length} entities · ${all.edges.length} relations`;
  draw(all.nodes, all.edges);
}
function draw(nodes, edges) {
  const net = new vis.Network(document.getElementById('net'),
    { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
    { nodes: { shape:'dot', size:12, font:{ color:'#e8e8ea' } },
      edges: { arrows:'to', font:{ size:9, color:'#9aa0aa', strokeWidth:0 }, color:{ color:'#3a4050' } },
      physics: { stabilization:{ iterations:200 }, barnesHut:{ springLength:140 } } });
  net.on('click', async (p) => {
    if (!p.nodes.length) return;
    const name = nodes.find(n => n.id === p.nodes[0]).label;
    const d = await (await fetch('/graph/entity/' + encodeURIComponent(name), { headers: H })).json();
    const info = document.getElementById('info');
    info.style.display = 'block';
    info.textContent = `${d.name}  (${d.type})\n\n` +
      d.out.map(e => `→ ${e.relation} → ${e.target}`).join('\n') + '\n' +
      d.in.map(e => `← ${e.relation} ← ${e.source}`).join('\n');
  });
}
document.getElementById('filter').oninput = (e) => {
  const t = e.target.value.trim().toLowerCase();
  if (!t) return draw(all.nodes, all.edges);
  const keep = new Set(all.nodes.filter(n => n.group.toLowerCase().includes(t)).map(n => n.id));
  all.edges.forEach(ed => { if (keep.has(ed.from) || keep.has(ed.to)) { keep.add(ed.from); keep.add(ed.to); } });
  draw(all.nodes.filter(n => keep.has(n.id)), all.edges.filter(ed => keep.has(ed.from) && keep.has(ed.to)));
};
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hybrid RAG – Spotify Architecture</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#e8e8ea; --muted:#9aa0aa; --acc:#1db954; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:860px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input, select, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid #2a2f3a; background:var(--card); color:var(--fg); }
  input { flex:1; min-width:240px; } button { background:var(--acc); color:#000; border:none; font-weight:600; cursor:pointer; }
  .card { background:var(--card); border-radius:10px; padding:16px; margin-top:16px; white-space:pre-wrap; }
  .src { font-size:13px; color:var(--muted); border-top:1px solid #2a2f3a; padding:6px 0; }
  .tag { font-size:11px; padding:1px 6px; border-radius:4px; background:#2a2f3a; margin-left:6px; }
</style>
</head>
<body>
<main>
  <h1>Hybrid RAG · Spotify-like Web App Architecture</h1>
  <p class="sub">BM25 + Qdrant vectors + Neo4j knowledge graph, fused with Reciprocal Rank Fusion · <a style="color:#1db954" href="/graph-view">Graph explorer</a></p>
  <form id="f">
    <input id="q" placeholder="e.g. Which service handles transcoding and where are files stored?" required />
    <select id="mode"><option>hybrid</option><option>bm25</option><option>dense</option><option>graph</option></select>
    <button>Ask</button>
  </form>
  <div id="out"></div>
</main>
<script>
const out = document.getElementById('out');
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  out.innerHTML = '<div class="card">Thinking…</div>';
  const key = localStorage.getItem('apiKey') || '';
  const r = await fetch('/query', { method:'POST',
    headers:{ 'Content-Type':'application/json', ...(key ? {'X-API-Key':key} : {}) },
    body: JSON.stringify({ question: q.value, mode: mode.value }) });
  if (r.status === 401) { const k = prompt('API key'); if (k) { try { localStorage.setItem('apiKey', k); } catch(_){} } out.innerHTML=''; return; }
  const d = await r.json();
  if (!r.ok) { out.innerHTML = `<div class="card">Error: ${d.detail}</div>`; return; }
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const facts = (d.facts || []).slice(0, 10).map(f => `${esc(f.subject)} → <b>${esc(f.relation)}</b> → ${esc(f.object)}`).join('<br>');
  out.innerHTML = `<div class="card">${esc(d.answer)}</div>` +
    (facts ? `<div class="card" style="white-space:normal"><b>Graph</b> · entities: ${esc((d.entities||[]).join(', '))}<br><br>${facts}</div>` : '') +
    `<div class="card">` +
    d.sources.map((s,i) => `<div class="src">[${i+1}] ${esc(s.section)} · p.${s.page}` +
      `<span class="tag">bm25 #${s.bm25_rank ?? '–'}</span><span class="tag">dense #${s.dense_rank ?? '–'}</span>` +
      `<span class="tag">graph #${s.graph_rank ?? '–'}</span><span class="tag">rrf ${s.score}</span></div>`).join('') + '</div>';
};
</script>
</body>
</html>
